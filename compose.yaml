services:
  app:
    build: .
    command: npm run dev
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
      - ./server.mjs:/app/server.mjs:ro
      - ./agp_mechanical_screen.csv:/app/agp_mechanical_screen.csv:ro
      - ./data:/app/data:ro
